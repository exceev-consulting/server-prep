<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Social preview of server-prep: the repository's card (Settings -> Social preview) and the
       og:image of the GitHub Pages site. The cover of the setup console: the dark rack band, the
       white tile with the name, the README tagline. Rendered to site/social-preview.png with
       IBM Plex Mono, IBM Plex Sans and Barlow Condensed installed. -->
  <defs>
    <radialGradient id="glow" cx="1050" cy="64" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".045"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rails" width="1280" height="44" patternUnits="userSpaceOnUse">
      <rect y="43" width="1280" height="1" fill="#FFFFFF" fill-opacity=".02"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#0B1117"/>
  <rect width="1280" height="640" fill="url(#rails)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <path d="M64 22h0 M64 66h0 M64 110h0 M64 154h0 M64 198h0 M64 242h0 M64 286h0 M64 330h0 M64 374h0 M64 418h0 M64 462h0 M64 506h0 M64 550h0 M64 594h0 M64 638h0" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(128 132) scale(2.125)">
    <path fill="#F4F7FA" fill-rule="evenodd" d="M18 0H46A18 18 0 0 1 64 18V46A18 18 0 0 1 46 64H18A18 18 0 0 1 0 46V18A18 18 0 0 1 18 0Z M32 18A9 9 0 0 1 36.2 35L38.3 42.6A2.6 2.6 0 0 1 35.8 46H28.2A2.6 2.6 0 0 1 25.7 42.6L27.8 35A9 9 0 0 1 32 18Z"/>
  </g>
  <text x="298" y="225.5" fill="#F4F7FA" font-family="IBM Plex Mono" font-weight="600" font-size="72.25" letter-spacing="-2.55">server-prep</text>
  <text fill="#B9C3CE" font-family="IBM Plex Sans" font-weight="400" font-size="40">
    <tspan x="128" y="360">Harden a fresh Debian or Ubuntu server</tspan>
    <tspan x="128" y="414">for your PaaS panel, and prove it with an audit.</tspan>
  </text>
  <rect x="128" y="500" width="18" height="2" rx="1" fill="#F4F7FA"/>
  <text x="158" y="510" fill="#9AA8B6" font-family="Barlow Condensed" font-weight="600" font-size="26" letter-spacing="3.12">VPS OR DEDICATED · COOLIFY, DOKPLOY, OPENSHIP · PLAIN BASH</text>
</svg>
