name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Syntax
        # one file per call: "bash -n a b" only checks a
        run: |
          for f in server-prep.sh server-audit.sh server-preconfig.sh extras/github-runners/*.sh scripts/*.sh tests/*.sh tests/e2e/*.sh tests/e2e/lib/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck --version | sed -n 2p
          shellcheck -S warning server-prep.sh server-audit.sh server-preconfig.sh extras/github-runners/*.sh scripts/*.sh tests/*.sh tests/e2e/*.sh tests/e2e/lib/*.sh

      - name: Help output
        run: for s in server-prep.sh server-preconfig.sh server-audit.sh; do ./"$s" --help >/dev/null; done

      - name: Site data up to date
        run: scripts/gen-data.sh --check

      - name: Exit status
        run: bash tests/exit-status.sh

      - name: E2E report builder
        run: bash tests/e2e-report.sh
