# server-prep answers for the end-to-end tests (tests/e2e/run.sh), read with --config.
# No secrets: the harness appends ADMIN_PUBKEY and PANEL_PUBKEY with keys it makes for
# each run. The name is not *.conf so it is not caught by the .gitignore rule for filled configs.
#
# The VM sits on a QEMU user network that uses the documentation range 198.51.100.0/24.
# The machine running the tests reaches it from 198.51.100.2, so that address plays both
# the admin's workstation and the panel server.

ADMIN_USER="admin"
PANEL="coolify"
PANEL_ACCESS="tailscale,public"
PANEL_IP="198.51.100.2"
CLOUDFLARED_TOKEN=""

SSH_PORT="822"
ADMIN_IPS="198.51.100.2"
EXPOSE_WEB="no"
EXTRA_PORTS=""

INSTALL_FAIL2BAN="yes"
INSTALL_CROWDSEC="yes"
CROWDSEC_ENROLL_KEY=""
CROWDSEC_LAPI_PORT="8091"
INSTALL_DOCKER="yes"
DOCKER_AUTO_UPDATE="yes"
AUTO_REBOOT="no"

DISABLE_SERVICES="avahi-daemon cups cups-browsed bluetooth ModemManager apport"
HEADLESS="no"
LAPTOP_MODE="auto"

INSTALL_AUDITD="yes"
INSTALL_RKHUNTER="yes"
INSTALL_AIDE="yes"
INSTALL_ENDLESSH="yes"
INSTALL_TELEGRAF="yes"
TELEGRAM_ENABLE="no"

TIMEZONE="UTC"
SWAP_SIZE="2G"
PTRACE_SCOPE="2"
